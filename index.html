<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="library">
      <div class="header">
        <h1>Library</h1>
        <button id="open-dialog-btn">Add Book</button>
      </div>
      <div class="book-container">
        <!-- books go here -->
      </div>

      <dialog id="book-dialog">
        <form id="book-form" method="dialog">
          <h2>Add New Book</h2>
          <div class="form-control">
            <label for="book-title">Title:</label>
            <input type="text" id="book-title" name="book-title" required />
          </div>

          <div class="form-control">
            <label for="book-author">Author:</label>
            <input type="text" id="book-author" name="book-author" required />
          </div>

          <div class="form-control">
            <label for="book-pages">Pages:</label>
            <input type="number" id="book-pages" name="book-pages" required />
          </div>
          <div class="form-actions">
            <button type="submit" id="save-book-btn">Save</button>
            <button type="button" id="cancel-dialog-btn">Cancel</button>
          </div>
        </form>
      </dialog>
    </div>

    <script src="app.js"></script>
  </body>
</html>
